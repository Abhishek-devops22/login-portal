{% extends 'base.html' %}

{% block body %}
  <div class="auth-card">
    <h1>Reset Password</h1>
    <form action="{{ request.path }}" method="post" novalidate>
      {{ form.csrf_token }}
      <div class="field">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" placeholder="New Password" data-rules="required,minlength:6">
        <p class="field-error" id="password-error">{{ form.password.errors[0] if form.password.errors else '' }}</p>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" data-rules="required,minlength:6">
        <p class="field-error" id="confirm_password-error">{{ form.confirm_password.errors[0] if form.confirm_password.errors else '' }}</p>
      </div>
      <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
  </div>
{% endblock %}
