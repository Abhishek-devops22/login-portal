{% extends 'base.html' %}

{% block body %}
  <div class="auth-card">
    <h1>Forgot Password</h1>
    <p class="link-muted">Enter your email and we'll send you a link to reset your password.</p>
    <form action="{{ url_for('forgot_password') }}" method="post" novalidate>
      {{ form.csrf_token }}
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email" value="{{ form.email.data or '' }}" data-rules="required,email">
        <p class="field-error" id="email-error">{{ form.email.errors[0] if form.email.errors else '' }}</p>
      </div>
      <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </form>
    <a class="link-muted" href="{{ url_for('index') }}">Back to login</a>
  </div>
{% endblock %}
