{% extends 'base.html' %}

{% block body %}
  <div class="auth-card">
    <h1>Login</h1>
    <form action="{{ url_for('sign_in') }}" method="post" novalidate>
      {{ form.csrf_token }}
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email" value="{{ form.email.data or '' }}" data-rules="required,email">
        <p class="field-error" id="email-error">{{ form.email.errors[0] if form.email.errors else '' }}</p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" data-rules="required">
        <p class="field-error" id="password-error">{{ form.password.errors[0] if form.password.errors else '' }}</p>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <a class="link-muted" href="{{ url_for('forgot_password') }}">Forgot Password?</a>
  </div>
{% endblock %}
